<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Excuse Kung Fu</title>
<meta name="description" content="Every excuse has a counter. Online coaching by Tom Allen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Dongle:wght@400;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#000000; --card:#141416; --ink:#FFFFFF; --muted:#9A9A97; --line:rgba(255,255,255,.85);
  --display:'Dongle','Archivo',sans-serif;
  --body:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100svh;display:flex;flex-direction:column;padding:56px 16px 28px}
.wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:40px;flex:1}
:focus-visible{outline:3px solid #fff;outline-offset:4px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{margin:0;width:100%}
.logo img{display:block;width:100%;height:auto;--m:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);-webkit-mask-image:var(--m);-webkit-mask-composite:source-in;mask-image:var(--m);mask-composite:intersect}
.tag{margin:0;color:var(--muted);font-size:17px}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;background:var(--card);transition:background .15s,color .15s}
.item:hover,.item:focus-visible,.item:active{background:var(--ink);color:var(--bg)}
.item:hover .sub,.item:focus-visible .sub,.item:active .sub{color:#3A3A3C}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.title{font-family:var(--display);font-weight:700;font-size:44px;line-height:.7}
.sub{font-size:15px;color:var(--muted);line-height:1.4}
.arrow{font-size:22px;font-weight:700;flex:none}
.item.soon{border-style:dashed;border-color:rgba(255,255,255,.3);background:transparent;cursor:default;opacity:.6}
.item.soon:hover{background:transparent;color:var(--ink)}
footer{text-align:center;font-size:13px;color:#5E5E5B;margin-top:48px}
@media (prefers-reduced-motion:reduce){.item{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo"><img src="/logo.jpg" alt="Excuse Kung Fu" width="1040" height="693"></h1>
    <p class="tag">Every excuse has a counter.</p>
  </header>
  <nav aria-label="Products and services"><ul id="items"></ul></nav>
</div>
<footer>© <span id="yr"></span> Excuse Kung Fu</footer>
<script>
/* Products and services: newest or most important first.
   Add one line per product. Set soon: true to show a greyed-out "coming soon" card. */
const ITEMS = [
  { title: 'Split Quiz', sub: 'Figure out the best gym split for you with this short quiz.', href: '/quiz/' },
];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('items').innerHTML = ITEMS.map(it => it.soon
  ? `<li><div class="item soon" aria-disabled="true"><span class="txt"><span class="title">${esc(it.title)}</span><span class="sub">${esc(it.sub || 'Coming soon')}</span></span></div></li>`
  : `<li><a class="item" href="${esc(it.href)}"><span class="txt"><span class="title">${esc(it.title)}</span><span class="sub">${esc(it.sub)}</span></span><span class="arrow" aria-hidden="true">→</span></a></li>`
).join('');
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
